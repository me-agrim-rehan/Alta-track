
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alta Fundamental 111 Challenge</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./CSS/style.css">

</head>

<body>

    <!-- Background animation -->
    <div class="dots-container"></div>


    <main class="container">

        <!-- =========================
             LEFT CONTENT
        ========================== -->

        <section class="left-content">

            <h1 class="gradient-title">
                Alta Challenge
            </h1>

            <h2 class="sub-heading">
                Paste your LinkedIn URL & track your University Rank
            </h2>

            <p class="description">
                Post questions daily to build your momentum.
                Do not lose your streak—climb the leaderboard
                and claim your top university ranking!
            </p>

        </section>


        <!-- =========================
             RIGHT CONTENT
        ========================== -->

        <section class="right-content">

            <div class="form-card">


                <!-- =========================
                     LOGIN / REGISTER TABS
                ========================== -->

                <div class="tab-switcher">

                    <button
                        type="button"
                        class="tab-btn active"
                        id="signInTabBtn"
                    >
                        Sign In
                    </button>

                    <button
                        type="button"
                        class="tab-btn"
                        id="signUpTabBtn"
                    >
                        Sign Up
                    </button>

                </div>


                <div class="form-wrapper">


                    <!-- =========================
                         SIGN IN
                    ========================== -->

                    <form
                        id="signInForm"
                        class="auth-form active"
                    >

                        <div class="input-group">

                            <label for="signin-email">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="signin-email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="signin-pass">
                                Password
                            </label>

                            <input
                                type="password"
                                id="signin-pass"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <!-- Login message -->

                        <p id="loginMessage"></p>


                        <button
                            type="submit"
                            class="submit-btn"
                            id="signInButton"
                        >
                            Sign In
                        </button>

                    </form>



                    <!-- =========================
                         SIGN UP
                    ========================== -->

                    <form
                        id="signUpForm"
                        class="auth-form scrollable-form"
                    >


                        <!-- Full Name -->

                        <div class="input-group">

                            <label for="signup-name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="signup-name"
                                name="name"
                                placeholder="Enter your full name"
                                maxlength="100"
                                autocomplete="name"
                                required
                            >

                        </div>



                        <!-- Email -->

                        <div class="input-group">

                            <label for="signup-email">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="signup-email"
                                name="email"
                                placeholder="Enter your email"
                                maxlength="255"
                                autocomplete="email"
                                required
                            >

                            <small id="emailMessage"></small>

                        </div>



                        <!-- Phone -->

                        <div class="input-group">

                            <label for="signup-phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="signup-phone"
                                name="phone"
                                placeholder="10-digit mobile number"
                                inputmode="numeric"
                                maxlength="10"
                                autocomplete="tel"
                                required
                            >

                            <small id="phoneMessage"></small>

                        </div>



                        <!-- Password -->

                        <div class="input-group">

                            <label for="signup-pass">
                                Password
                            </label>

                            <input
                                type="password"
                                id="signup-pass"
                                name="password"
                                placeholder="Create a strong password"
                                autocomplete="new-password"
                                required
                            >

                        </div>



                        <!-- Year + Campus -->

                        <div class="form-row">


                            <div class="input-group">

                                <label for="signup-year">
                                    Year
                                </label>

                                <select
                                    id="signup-year"
                                    name="year"
                                    required
                                >

                                    <option
                                        value=""
                                        disabled
                                        selected
                                    >
                                        Select Year
                                    </option>

                                    <option value="1">
                                        Year 1
                                    </option>

                                    <option value="2">
                                        Year 2
                                    </option>

                                    <option value="3">
                                        Year 3
                                    </option>

                                    <option value="4">
                                        Year 4
                                    </option>

                                </select>

                            </div>



                            <div class="input-group">

                                <label for="signup-campus">
                                    Campus
                                </label>

                                <select
                                    id="signup-campus"
                                    name="campus"
                                    required
                                >

                                    <option
                                        value=""
                                        disabled
                                        selected
                                    >
                                        Select Campus
                                    </option>

                                    <option value="ADYPU Pune">
                                        ADYPU Pune
                                    </option>

                                    <option value="SAGE University Indore">
                                        SAGE University Indore
                                    </option>

                                    <option value="IITM Delhi NCR">
                                        IITM Delhi NCR
                                    </option>

                                    <option value="Vivekananda Global University Jaipur">
                                        Vivekananda Global University Jaipur
                                    </option>

                                    <option value="DRK Institute Hyderabad">
                                        DRK Institute Hyderabad
                                    </option>

                                </select>

                            </div>

                        </div>



                        <!-- Program -->

                        <div class="input-group">

                            <label for="signup-program">
                                Program
                            </label>

                            <select
                                id="signup-program"
                                name="program"
                                required
                            >

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Select Program
                                </option>

                                <option value="ALTA_FOUNDATION_111">
                                    ALTA Foundation 111
                                </option>

                                <option value="ALTA_APEX">
                                    ALTA Apex
                                </option>

                            </select>

                        </div>



                        <!-- Registration message -->

                        <p id="registerMessage"></p>



                        <button
                            type="submit"
                            class="submit-btn"
                            id="registerButton"
                        >
                            Create Account
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Your real authentication logic -->

    <script
        type="module"
        src="./JS/script.js"
    ></script>

</body>

</html>
