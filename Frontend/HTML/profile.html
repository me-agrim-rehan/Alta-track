<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | Alta 111</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../CSS/profile.css">
</head>
<body class="profile-body">

  <header class="top-navbar">
    <div class="nav-content">
      <div class="nav-brand">
        <a href="dashboard.html" class="back-link" title="Back to Dashboard">
          <svg class="back-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
          </svg>
        </a>
        <div class="brand-badge">111</div>
        <span class="brand-title">Profile Settings</span>
      </div>

      <div class="nav-user-area">
        <div class="profile-dropdown-container">
          <button type="button" class="profile-avatar-btn" id="avatarMenuBtn" onclick="toggleProfileDropdown()">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=AltaUser" alt="Profile Avatar" class="profile-avatar-img" id="navAvatar">
          </button>

          <div class="profile-dropdown-menu hidden" id="profileDropdown">
            <div class="dropdown-header">
              <span class="dropdown-user-name" id="dropdownName">User Name</span>
              <span class="dropdown-user-campus" id="dropdownCampus">Campus</span>
            </div>
            <div class="dropdown-body">
              <div class="dropdown-item">
                <span class="item-label">Phone</span>
                <span class="item-val" id="dropdownPhone">+91 ---------</span>
              </div>
              <div class="dropdown-item">
                <span class="item-label">Email</span>
                <span class="item-val" id="dropdownEmail">user@example.com</span>
              </div>
            </div>
            <div class="dropdown-footer">
              <button type="button" class="dropdown-edit-btn" onclick="enableEditModeFromDropdown()">
                ✏️ Edit Profile
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="profile-main">
    <div class="profile-card">
      
      <div class="profile-card-header">
        <div class="avatar-large-wrap">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=AltaUser" alt="User Avatar Large" class="avatar-large" id="mainAvatar">
        </div>
        <div class="user-main-info">
          <h1 class="user-display-name" id="dispName">Loading...</h1>
          <p class="user-display-campus" id="dispCampus">Loading...</p>
        </div>
      </div>

      
      <form id="profileForm" onsubmit="saveProfileChanges(event)">
        <div class="info-grid">

          <div class="field-group">
            <label class="field-label" for="inputName">Full Name</label>
            <input type="text" id="inputName" class="field-input" disabled required />
          </div>

          <div class="field-group">
            <label class="field-label" for="inputCampus">Campus / College</label>
            <input type="text" id="inputCampus" class="field-input" disabled required />
          </div>

          <div class="field-group">
            <label class="field-label" for="inputPhone">Phone Number</label>
            <input type="tel" id="inputPhone" class="field-input" disabled required />
          </div>

          <div class="field-group">
            <label class="field-label" for="inputEmail">Email Address</label>
            <input type="email" id="inputEmail" class="field-input" disabled required />
          </div>

        </div>

        <div class="form-actions">
          <button type="button" class="btn-edit-toggle" id="editToggleBtn" onclick="toggleEditMode()">
            <span>✏️ Edit Profile</span>
          </button>
          
          <div class="save-cancel-group hidden" id="saveCancelGroup">
            <button type="button" class="btn-cancel" onclick="cancelEditMode()">Cancel</button>
            <button type="submit" class="btn-save">Save Changes</button>
          </div>
        </div>
      </form>

    </div>
  </main>

  <script src="../JS/profile.js"></script>
</body>
</html>
