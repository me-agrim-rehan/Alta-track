<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta Fundamental 111 Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style.css">
  <script src="../JS/script.js" defer></script>


</head>

<body>

  <div class="dots-container"></div>

  <main class="container">

    <section class="left-content">
      <h1 class="gradient-title">Alta Challenge</h1>
      <h2 class="sub-heading">Paste your LinkedIn URL & track your University Rank</h2>
      <p class="description">
        Post questions daily to build your momentum. Do not lose your streak—climb the leaderboard and claim your top
        university ranking!
      </p>
    </section>

    <section class="right-content">
      <div class="form-card">

        <div class="tab-switcher">
          <button type="button" class="tab-btn active" id="signInTabBtn" onclick="switchTab('signIn')">Sign In</button>
          <button type="button" class="tab-btn" id="signUpTabBtn" onclick="switchTab('signUp')">Sign Up</button>
        </div>

        <div class="form-wrapper">

          <form id="signInForm" class="auth-form active" action="#" method="post"
            onsubmit="handleFormSubmit(event, 'Sign In')">
            <div class="input-group">
              <label for="signin-email">E-mail</label>
              <input type="email" id="signin-email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
              <label for="signin-pass">Password</label>
              <input type="password" id="signin-pass" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
          </form>

          <form id="signUpForm" class="auth-form scrollable-form" action="#" method="post"
            onsubmit="handleFormSubmit(event, 'Sign Up')">
            <div class="input-group">
              <label for="signup-name">Full Name</label>
              <input type="text" id="signup-name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
              <label for="signup-email">E-mail</label>
              <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
              <label for="signup-phone">Phone Number</label>
              <input type="tel" id="signup-phone" name="phone" placeholder="+91 98765 43210" pattern="[0-9+\s-]{8,15}"
                required>
            </div>

            <div class="input-group">
              <label for="signup-pass">Password</label>
              <input type="password" id="signup-pass" name="password" placeholder="Create a strong password" required>
            </div>


            <div class="form-row">
              <div class="input-group">
                <label for="signup-year">Year</label>
                <select id="signup-year" name="year" required>
                  <option value="" disabled selected>Select Year</option>
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                  <option value="Alumni">Alumni</option>
                </select>
              </div>

              <div class="input-group">
                <label for="signup-campus">Campus</label>
                <select id="signup-campus" name="campus" required>
                  <option value="" disabled selected>Select Campus</option>
                  <option value="IITM Sonipat">IITM Sonipat</option>
                  <option value="Sage University">Sage University</option>
                  <option value="ADYPU Pune">ADYPU Pune</option>
                  <option value="Hyderabad">Hyderabad</option>
                </select>
              </div>
            </div>

            <div class="input-group">
              <label for="signup-program">Program</label>
              <select id="signup-program" name="program" required>
                <option value="" disabled selected>Select Program</option>
                <option value="Alta Fundamental 111">Alta Fundamental 111</option>
                <option value="Alta Apex 151">Alta Apex 151</option>
              </select>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
          </form>

        </div>

      </div>
    </section>

  </main>


</body>

</html>
